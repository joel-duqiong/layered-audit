# 归属规则: owner = 能给出可复现证据的最低层。高层可引用低层缺陷作佐证, 不得重复开单。
attribution:
  - {pattern: "单号碰撞/唯一键冲突", layers: [function, service], owner: function}
  - {pattern: "成交价无上界/定价权在客户端", layers: [function, service, integration], owner: function}
  - {pattern: "快照明细归属/空明细回退", layers: [function, integration], owner: function}
  - {pattern: "上传内容不嗅探/无体积上限", layers: [function, service], owner: function}
  - {pattern: "非法状态跃迁", layers: [class, service], owner: class}
  - {pattern: "上传任意字节落盘", layers: [service, integration], owner: service}
  - {pattern: "无鉴权导致越权读写", layers: [service, integration], owner: service}
  - {pattern: "错误响应回显内部细节(DB约束名/原始请求体)", layers: [file, service], owner: file}
  - {pattern: "审计日志来源IP被客户端伪造", layers: [file], owner: file}
  - {pattern: "同一限制的数字散落多处(配置/文案/接口文档)", layers: [file], owner: file}
  - {pattern: "同一类错误两种状态码(400 vs 422)", layers: [file, service], owner: file}
  - {pattern: "客户端可控值直接进日志/日志行可被切分", layers: [file], owner: file}
  - {pattern: "先变更后校验(中途失败留残局)", layers: [file], owner: file}
  - {pattern: "静态资源根目录规范化依赖环境偶然", layers: [file], owner: file}
  - {pattern: "分页/校验辅助方法跨文件逐字复制", layers: [file, service], owner: file}
  - {pattern: "NOT NULL 只挡 NULL，空串/默认值绕过业务非空", layers: [class], owner: class}
  - {pattern: "必填性校验落在服务层而非 DTO 契约", layers: [class], owner: class}
  - {pattern: "业务不变量三层全无声明(DB/DTO/服务层都没有)", layers: [class], owner: class}
  - {pattern: "同一默认值在 DB default / DTO 缺省 / 服务层兜底各写一遍", layers: [class], owner: class}
  - {pattern: "PUT 全量覆盖抹掉未传字段(图片引用丢失)", layers: [class], owner: class}
  - {pattern: "错误文案与真实触发原因不符", layers: [class], owner: class}
  - {pattern: "对外枚举大小写敏感", layers: [class, service], owner: class}
  - {pattern: "匿名写入连带重写订单快照(快照失去证据效力)", layers: [integration], owner: integration}
  - {pattern: "上传内容可被匿名原样读回", layers: [integration], owner: integration}
  - {pattern: "敏感字段只在渲染层脱敏(接口与库都是明文)", layers: [integration], owner: integration}
  - {pattern: "同一份数据前端两处计数口径不一致", layers: [integration], owner: integration}
  - {pattern: "兜底图取自别的资源域(商品位用套餐图)", layers: [integration], owner: integration}
  - {pattern: "DB/API/前端三方数值不一致", layers: [integration], owner: integration}
