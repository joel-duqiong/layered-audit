server:
  port: ${SERVER_PORT:8090}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/demo_shop}
    username: ${SPRING_DATASOURCE_USERNAME:jiuyan}
    password: ${SPRING_DATASOURCE_PASSWORD:jiuyan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
app:
  fx-base-url: ${APP_FX_BASE_URL:http://127.0.0.1:8098}
  demo-marker: demo
